# SonarQube / SonarCloud Project Configuration
sonar.projectKey=olakra_openapply
sonar.projectName=OpenApply
sonar.projectVersion=0.0.1

# Source code directories to scan
sonar.sources=src,apps,packages

# Exclude build output, node_modules, and documentation dist files
sonar.exclusions=**/node_modules/**,**/dist/**,**/.vitepress/dist/**,**/build/**,**/coverage/**

# Encoding
sonar.sourceEncoding=UTF-8
